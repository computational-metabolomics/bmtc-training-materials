name: Build and Deploy Bookdown

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("bookdown", "rmarkdown"))'

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
          with:
            packages: |
              cran::fontawesome
            cran::ggplot2
            bioc::struct
            bioc::structToolbox
      
      - name: Render book
        working-directory: pre-course-materials
        run: |
          Rscript -e 'bookdown::render_book("index.Rmd")'
         
      - name: Copy static assets
        run: |
          cp -r pre-course-materials/content pre-course-materials/docs/
        
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
          with:
            path: ./pre-course-materials/docs

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4